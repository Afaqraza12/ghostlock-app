name: Build GhostLock APK (SOG05 profile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: false
        default: "debug"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show kernel profiles shipped
        run: |
          echo "=== kernel profiles ==="
          ls -la app/src/main/assets/kernel_profiles/ | head -20
          grep -n "5.4.210" app/src/main/assets/kernel_profiles/index.conf || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-sog05-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to a rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sog05-latest
          name: "GhostLock SOG05 (latest build)"
          body: |
            Auto-built APK with the Sony Xperia 5 III (SOG05 / pdx214) kernel profile:
            `5.4.210-qgki-g55a0c74ba38a`

            Credits:
            - Upstream: [YuKongA/ghostlock-app](https://github.com/YuKongA/ghostlock-app)
            - SOG05 kernel profile + offsets: [Afaqraza12/ghostlock_5.4_xperia](https://github.com/Afaqraza12)
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
