# Ported from the proven open-source SOG05 exploit (ghostlock_5.4_xperia by Afaq Raza)
# and cross-checked against live /proc/kallsyms (offsets are relative to _text, matching
# the app convention: symbol_addr - _text). Route: select_stack (pselect), waiter_shift
# -2, proven live (W1 landed, W2 uid=0, module loaded & KernelSU booted).
